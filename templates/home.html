<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Groupie Tracker</title>
</head>
<body>
    <h1>Nos artistes</h1>
    {{range .}}
        <div>
            <h2>{{.Nom}}</h2>
            <img src="{{.Image}}" alt="Photo de {{.Nom}}">
            <a href="/artist?id={{.Id}}">Voir le détail</a>
        </div>
    {{end}}
</body>
</html>
