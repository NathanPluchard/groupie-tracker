
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101018">
    <title>Groupie Tracker | Music Discovery</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    {{range .}}
    <article class="artist-card" data-search="{{.Nom}} {{range .Membres}}{{.}} {{end}}">

        <div class="artist-image">
            {{if .Image}}
            <img src="{{.Image}}" alt="Photo de {{.Nom}}" loading="lazy">
            {{else}}
            <div class="image-placeholder">♫</div>
            {{end}}

            <span class="artist-number">#{{.Id}}</span>
        </div>

        <div class="artist-info">
            <span class="artist-category">ARTISTE / GROUPE</span>

            <h3>{{.Nom}}</h3>

            <div class="artist-details">
                <span>Depuis {{.CreationDate}}</span>
                <span>{{len .Membres}} membres</span>
            </div>

            <div class="artist-album">
                Premier album : {{.PremierAlbum}}
            </div>
        </div>

    </article>
    {{end}}
</div>


    </section>
</main>                    
    <footer class="site-footer">
        <a href="/" class="logo">GROUPIE<span>TRACKER.</span></a>
        <p>Une exploration de l'univers musical.</p>
        <p class="copyright">© 2026 — Projet étudiant</p>
    </footer>

    <script src="/static/js/main.js"></script>
</body>
</html>
